# The system registry (graph_system_registry) measured against what actually runs. Answers:
# which workers exist, which of them the registry knows, and which are alive. Its output is the
# info of observed-registry-coverage in that graph. Sourced by orient.sh.
#
# What runs: a list of deployed worker names, one per line "name<TAB>last-modified-date".
# Point ORIENT_DEPLOYED at it. Make it from the Cloudflare account — in a Claude session with the
# Cloudflare connector: workers_list; on the Mac: the Cloudflare dashboard or API. Without it the
# script falls back to the names in */wrangler.toml, which is the 2026-10-05 method.

LAYER=graph_system_registry
LAYER_TITLE="System registry graph"
OBSERVED_NODE=observed-registry-coverage

# GitHub name | path on Tor Arne's Mac
REPOS=(
  "vegvisr-frontend|/Volumes/T7/vegvisr-frontend"
  "Agent-Builder|/Users/torarnehave/Documents/GitHub/Agent-Builder"
)

DORMANT_DAYS=180   # not changed for this long = listed as dormant, not as missing work

run_sections() {
  section_repos

  local MONO AB
  MONO="$(repo_path vegvisr-frontend)"; AB="$(repo_path Agent-Builder)"

  section "Coverage: deployed workers vs registry nodes (metadata.name)"
  curl -s "$KG/getknowgraph?id=graph_system_registry" "${H[@]}" | python3 -c '
import sys, json, os, re, glob, datetime
mono, ab, deployed_file, dormant_days = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4])
reg = json.load(sys.stdin).get("nodes", [])
if not reg:
    print("REGISTRY NOT READABLE — stop and ask"); sys.exit()
known = {}
unnamed = []
for n in reg:
    name = (n.get("metadata") or {}).get("name")
    if n["id"].startswith("db-"): continue      # databases share the name field; not workers
    if name: known[name] = n["id"]
    elif n["id"].startswith(("worker-", "sysworker-")): unnamed.append(n)

# wrangler names on disk -> folder (the secret-bearing tomls are gitignored, so a fresh clone
# has only the tracked ones; on the Mac all of them are there)
toml = {}
for repo in (mono, ab):
    for f in glob.glob(os.path.join(repo, "*", "wrangler.toml")) + glob.glob(os.path.join(repo, "*", "*", "wrangler.toml")):
        m = re.search(r"^name\s*=\s*\"([^\"]+)\"", open(f, errors="ignore").read(), re.M)
        if m: toml[m.group(1)] = os.path.relpath(os.path.dirname(f), os.path.dirname(repo))
folders = {os.path.basename(p): os.path.relpath(p, os.path.dirname(mono)) for p in glob.glob(os.path.join(mono, "*")) if os.path.isdir(p)}

def source(name):
    if name in toml: return toml[name]
    base = re.sub(r"-production$", "", name)
    if base in folders: return folders[base] + " (folder name, toml not here)"
    return "—"

if deployed_file and os.path.isfile(deployed_file):
    rows = [l.rstrip("\n").split("\t") for l in open(deployed_file) if l.strip()]
    deployed = {r[0]: (r[1] if len(r) > 1 else "") for r in rows}
    basis = "deployed list (%s, %d workers)" % (os.path.basename(deployed_file), len(deployed))
else:
    deployed = {k: "" for k in toml}
    basis = "names in */wrangler.toml (%d) — no deployed list given" % len(deployed)

today = datetime.date.today()
def age(d):
    try: return (today - datetime.date.fromisoformat(d[:10])).days
    except Exception: return None

missing = sorted(n for n in deployed if n not in known)
alive = [n for n in missing if (age(deployed[n]) is None or age(deployed[n]) <= dormant_days)]
dormant = [n for n in missing if n not in alive]
print("basis:", basis)
print("tomls readable here:", len(toml), "| registry nodes with metadata.name:", len(known))
print("deployed:", len(deployed), "| in registry:", len(deployed) - len(missing), "| absent:", len(missing),
      "(changed within %d days: %d, dormant: %d)" % (dormant_days, len(alive), len(dormant)))

print("\n--- absent from the registry, changed within %d days (name | last changed | source) ---" % dormant_days)
for n in sorted(alive, key=lambda n: deployed[n], reverse=True):
    print("  %s | %s | %s" % (n, deployed[n] or "?", source(n)))
print("\n--- absent from the registry, dormant (name | last changed) ---")
print("  " + ", ".join("%s (%s)" % (n, deployed[n]) for n in sorted(dormant)))
print("\n--- worker nodes in the registry with no metadata.name (described, but invisible to this comparison) ---")
for n in unnamed:
    print("  %s | %s" % (n["id"], n.get("label")))
print("\n--- in the registry, not deployed (name | node) ---")
for n in sorted(k for k in known if k not in deployed):
    print("  %s | %s" % (n, known[n]))
' "$MONO" "$AB" "${ORIENT_DEPLOYED:-}" "$DORMANT_DAYS" 2>&1 || echo "(could not read graph_system_registry)"

  section "Layers with their own graph (pointer-layer-* in the registry)"
  curl -s "$KG/getknowgraph?id=graph_system_registry" "${H[@]}" | python3 -c '
import sys, json
for n in json.load(sys.stdin).get("nodes", []):
    m = n.get("metadata") or {}
    if m.get("role") == "pointer" and m.get("layer"):
        print("  %s | %s | %s" % (m["layer"], m.get("graphId"), n.get("label")))
' 2>/dev/null
  printf '  orient configs: %s\n' "$(ls "$HERE"/systems/*.conf 2>/dev/null | xargs -n1 basename | sed 's/\.conf$//' | tr '\n' ' ')"
}
