# Knowledge graph and MCP — the core layer: knowledge-graph-worker (graph store, REST API, the
# MCP server and its OAuth), drizzle-worker, seo-worker, openapi-worker and the MCP-created
# workers. Sourced by orient.sh.

LAYER=af6d576d-fcf3-4153-86af-040921c411d3
LAYER_TITLE="Knowledge graph and MCP layer graph"
OBSERVED_NODE=observed-knowledge-surfaces

# GitHub name | path on Tor Arne's Mac
REPOS=(
  "vegvisr-frontend|/Volumes/T7/vegvisr-frontend"
)

run_sections() {
  section_repos
  section_worker_commits vegvisr-frontend dev-worker dev-worker/mcp dev-worker/oauth drizzle-worker seo-worker openapi-worker hello-mcp-worker mcp-workers

  section_graph_node "Registry node worker-knowledge-graph (graph_system_registry)" \
    graph_system_registry worker-knowledge-graph "name:name|domain:domain"
  section_graph_node "Registry node worker-drizzle (graph_system_registry)" \
    graph_system_registry worker-drizzle "name:name|domain:domain"

  # Knowledge's own checks.
  local MONO; MONO="$(repo_path vegvisr-frontend)"

  section "MCP server (dev-worker/mcp/server.js, tools.js)"
  printf '  version: %s\n' "$(grep -oE "version: ?['\"][0-9.]+['\"]" "$MONO/dev-worker/mcp/server.js" 2>/dev/null | head -1 | grep -oE "[0-9.]+")"
  local tools; tools="$(sed -n '/export const TOOL_NAMES/,/^]/p' "$MONO/dev-worker/mcp/tools.js" 2>/dev/null | grep -oE "^\s*'[a-z_]+'" | tr -d " '")"
  printf '  tools: %s\n' "$(printf '%s\n' "$tools" | grep -c .)"
  printf '%s\n' "$tools" | tr '\n' ' ' | fold -s -w 100 | sed 's/^/    /'; echo
  printf '  OAuth scopes (dev-worker/oauth/scopes.js): %s\n' \
    "$(grep -oE "'[a-z]+:[a-z]+'" "$MONO/dev-worker/oauth/scopes.js" 2>/dev/null | sort -u | tr -d "'" | tr '\n' ' ')"

  section "What knowledge-graph-worker calls (service bindings in dev-worker/wrangler.toml, tracked)"
  awk '/^\[\[services\]\]/{s=1;next} s&&/^binding/{b=$3} s&&/^service/{gsub(/"/,"",b);gsub(/"/,"",$3);print "  " b " -> " $3; s=0}' \
    "$MONO/dev-worker/wrangler.toml" 2>/dev/null
  printf '  storage: %s\n' "$(grep -A1 -E '^\[\[(d1_databases|kv_namespaces|r2_buckets)\]\]' "$MONO/dev-worker/wrangler.toml" 2>/dev/null \
    | grep -oE '^binding *= *"[^"]+"' | sed -E 's/.*"(.*)"/\1/' | tr '\n' ' ')"

  section_openapi "knowledge-graph-worker live routes (knowledge.vegvisr.org/openapi.json)" \
    https://knowledge.vegvisr.org/openapi.json

  section "How the layer deploys (.github/workflows in vegvisr-frontend)"
  ls "$MONO/.github/workflows" 2>/dev/null | sed 's/^/  /'
  printf '  MCP-created workers (mcp-workers/): %s\n' "$(ls "$MONO/mcp-workers" 2>/dev/null | tr '\n' ' ')"
}
