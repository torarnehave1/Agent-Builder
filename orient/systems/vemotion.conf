# VEmotion — the layer-based video composer, across four surfaces: the app, vemotion-worker,
# Agent-Builder and the MCP server. Sourced by orient.sh.

LAYER=b8527fde-96e7-4c68-b1fe-d97b82c2e13b
LAYER_TITLE="VEmotion layer graph"
OBSERVED_NODE=observed-vemotion-surfaces

# GitHub name | path on Tor Arne's Mac
REPOS=(
  "vemotion|/Volumes/T7/video-generator"
  "vegvisr-frontend|/Volumes/T7/vegvisr-frontend"
  "Agent-Builder|/Users/torarnehave/Documents/GitHub/Agent-Builder"
)

run_sections() {
  section_repos
  section_worker_commits vegvisr-frontend vemotion-worker dev-worker

  section_graph_node "Work context ctx-vemotion (what the Agent-Builder agent gets)" \
    0b61898c-c892-4dbc-9e35-2980e274a5d8 ctx-vemotion "tools:tools" "starterPrompts:starterPrompts~"

  section_graph_node "Registry node sysworker-vemotion (graph_system_registry)" \
    graph_system_registry sysworker-vemotion "binding:binding|openapi:openapi_url|prefix:tool_prefix" "blocklist:tool_blocklist"

  section_openapi "vemotion-worker live routes (api.vegvisr.org/vemotion/openapi.json)" \
    https://api.vegvisr.org/vemotion/openapi.json

  # VEmotion's own checks — not shared with other systems.
  local AB APP
  AB="$(repo_path Agent-Builder)"; APP="$(repo_path vemotion)"

  section "Agent-Builder vemotion tools (tool-definitions.js) and MCP forward allow-list"
  grep -oE "name: '(vemotion_[a-z_]+|get_vemotion_reference|get_carousel_reference)'" "$AB/worker/tool-definitions.js" 2>/dev/null | sed "s/name: /  /"
  sed -n '/VEMOTION_MCP_TOOLS = new Set/,/\])/p' "$AB/worker/index.js" 2>/dev/null | grep -oE "^ *'[a-z_]+'" | tr -d ' ' | tr '\n' ' ' | sed 's/^/  forwarded to MCP: /'; echo

  section_mcp_tools "MCP server VEmotion / Instagram tools (dev-worker/mcp/tools.js TOOL_NAMES)" \
    "vemotion|instagram|media"

  section "App query parameters handled (src/App.tsx, cloud-compositions.ts, auth.ts)"
  grep -hoE "searchParams\.get\('[a-zA-Z]+'\)|\.get\('(embed|renderJob|magic|dev|compositionId)'\)" "$APP/src/App.tsx" "$APP/src/lib/cloud-compositions.ts" "$APP/src/lib/auth.ts" 2>/dev/null | sort -u | sed 's/^/  /'

  section "App build marker (bump on every push)"
  grep -oE "Build marker [A-Z]{2}\"" "$APP/src/components/Dashboard.tsx" 2>/dev/null | head -1 | sed 's/^/  /'
}
