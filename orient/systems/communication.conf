# Communication — e-mail and SMS (WhatsApp is still provisioning). The layer graph holds the
# contract and the open findings; this measures what they are about. Sourced by orient.sh.

LAYER=3ae23b4f-f185-4bfd-bdf0-726dc6afed88
LAYER_TITLE="Communication layer graph"
OBSERVED_NODE=observed-communication-surfaces   # does not exist yet

# GitHub name | path on Tor Arne's Mac
REPOS=(
  "vegvisr-frontend|/Volumes/T7/vegvisr-frontend"
)

run_sections() {
  section_repos
  # sms-worker deploys as sms-gateway; dev-worker holds the MCP send paths; brand-worker the
  # other caller of SMS_GATEWAY (the OTP and contact form).
  section_worker_commits vegvisr-frontend sms-worker email-worker dev-worker/sms-service.js dev-worker/email-service.js brand-worker

  section_graph_node "Registry node worker-email (graph_system_registry)" \
    graph_system_registry worker-email "binding:binding|name:name|domain:domain"
  section "Registry node for the SMS gateway"
  echo "  none — sms-gateway has no node in graph_system_registry (see observed-registry-coverage there)"

  section_openapi "sms-gateway live routes (smsgway.vegvisr.org/openapi.json)" \
    https://smsgway.vegvisr.org/openapi.json
  section_openapi "email-worker live routes (email.vegvisr.org/openapi.json)" \
    https://email.vegvisr.org/openapi.json

  section_mcp_tools "MCP server e-mail / SMS tools (dev-worker/mcp/tools.js TOOL_NAMES)" "sms|email"

  # Communication's own checks — each one measures a row of the contract or an open finding.
  local MONO; MONO="$(repo_path vegvisr-frontend)"

  section "Where the audit row is written (files with INSERT INTO *_send_log)"
  grep -rlE "INSERT INTO (sms_send_log|email_send_log)" --include=*.js "$MONO" 2>/dev/null \
    | grep -v node_modules | sed "s#^$MONO/#  #"
  printf '  sms-worker (the gateway) writes a send log: %s\n' \
    "$(grep -qE "INSERT INTO [a-z_]*(send|sms)_log" "$MONO/sms-worker/index.js" 2>/dev/null && echo yes || echo no)"

  section "MCP SMS config the code reads (names only — values are Cloudflare secrets/vars)"
  grep -oE "MCP_SMS_[A-Z_]+" "$MONO/dev-worker/sms-service.js" 2>/dev/null | sort -u | sed 's/^/  /'

  section "Gateway POST /api/sms without credentials (finding-sms-send-unauthenticated)"
  # An empty body fails field validation before ClickSend is reached, so this cannot send.
  # 400 "Missing to/recipients" = the handler answered with no gate; 401/403 = a gate exists.
  printf '  HTTP %s\n' "$(curl -s -m 15 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://smsgway.vegvisr.org/api/sms)"

  section "Gateway GET /api/sms/history without credentials (finding-sms-no-audit-row)"
  # Status code only — the body would hold recipients' phone numbers and is never read.
  printf '  HTTP %s\n' "$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://smsgway.vegvisr.org/api/sms/history)"
}
